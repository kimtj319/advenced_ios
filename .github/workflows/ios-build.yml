name: iOS Test & Build Unsigned IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Validate Info.plist
        run: plutil -lint App/Info.plist

      - name: Run Unit Tests on iOS Simulator
        run: |
          SIM_UDID=$(xcrun simctl list devices available -j | python3 -c "import sys, json; data=json.load(sys.stdin)['devices']; print(next(d['udid'] for r in sorted(data.keys(), reverse=True) if 'iOS' in r for d in data[r] if 'iPhone' in d['name'] and d['isAvailable']))")
          echo "Using Simulator UDID: $SIM_UDID"
          xcodebuild test \
            -project YouTubeAdvanced.xcodeproj \
            -scheme YouTubeAdvanced \
            -destination "platform=iOS Simulator,id=$SIM_UDID"

      - name: Build Unsigned Release Archive
        run: |
          xcodebuild archive \
            -project YouTubeAdvanced.xcodeproj \
            -scheme YouTubeAdvanced \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/YouTubeAdvanced.xcarchive" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=NO

      - name: Package Unsigned IPA
        run: |
          APP_PATH="$RUNNER_TEMP/YouTubeAdvanced.xcarchive/Products/Applications/YouTubeAdvanced.app"
          PKG_DIR="$RUNNER_TEMP/ipa"
          mkdir -p "$PKG_DIR/Payload"
          cp -R "$APP_PATH" "$PKG_DIR/Payload/YouTubeAdvanced.app"
          rm -rf "$PKG_DIR/Payload/YouTubeAdvanced.app/_CodeSignature"
          rm -f "$PKG_DIR/Payload/YouTubeAdvanced.app/embedded.mobileprovision"
          (cd "$PKG_DIR" && zip -r -y "$GITHUB_WORKSPACE/YouTubeAdvanced-unsigned.ipa" Payload)
          unzip -l "$GITHUB_WORKSPACE/YouTubeAdvanced-unsigned.ipa"

      - name: Upload Unsigned IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YouTubeAdvanced-unsigned-ipa
          path: YouTubeAdvanced-unsigned.ipa
          retention-days: 14
