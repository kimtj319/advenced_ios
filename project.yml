name: YouTubeAdvanced
options:
  bundleIdPrefix: com.personal.ytadvanced
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
    "CODE_SIGN_IDENTITY[sdk=iphoneos*]": ""
    "CODE_SIGNING_REQUIRED[sdk=iphoneos*]": NO

targets:
  YouTubeAdvanced:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Core
      - path: MediaEngine
      - path: Features
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personal.ytadvanced.app
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
      configs:
        Debug:
          ENABLE_TESTABILITY: YES

  YouTubeAdvancedTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: YouTubeAdvanced
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personal.ytadvanced.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/YouTubeAdvanced.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/YouTubeAdvanced"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  YouTubeAdvanced:
    build:
      targets:
        YouTubeAdvanced: all
        YouTubeAdvancedTests: [test]
    test:
      targets:
        - YouTubeAdvancedTests
